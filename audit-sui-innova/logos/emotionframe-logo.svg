<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 144" role="img" aria-label="EmotionFrame">
  <defs>
    <!-- Gradients fuer die vier Rahmen-Seiten -->
    <linearGradient id="topSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8AEE8"/>
      <stop offset="50%" stop-color="#6EE0BE"/>
      <stop offset="100%" stop-color="#68DAC8"/>
    </linearGradient>
    <linearGradient id="rightSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68DAC8"/>
      <stop offset="50%" stop-color="#5DB8EA"/>
      <stop offset="100%" stop-color="#5AA0F0"/>
    </linearGradient>
    <linearGradient id="bottomSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6BE8"/>
      <stop offset="50%" stop-color="#5AA0F0"/>
      <stop offset="100%" stop-color="#5AA0F0"/>
    </linearGradient>
    <linearGradient id="leftSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5A5B5"/>
      <stop offset="30%" stop-color="#B8AEE8"/>
      <stop offset="70%" stop-color="#9C7EE0"/>
      <stop offset="100%" stop-color="#7C6BE8"/>
    </linearGradient>
  </defs>

  <!-- Rahmen-Symbol (Frame): 4 Seiten in unterschiedlichen Farben -->
  <g transform="translate(0,8)">
    <!-- Oben -->
    <rect x="8" y="8" width="120" height="18" fill="url(#topSide)"/>
    <!-- Rechts -->
    <rect x="110" y="8" width="18" height="120" fill="url(#rightSide)"/>
    <!-- Unten -->
    <rect x="8" y="110" width="120" height="18" fill="url(#bottomSide)"/>
    <!-- Links -->
    <rect x="8" y="8" width="18" height="120" fill="url(#leftSide)"/>
  </g>

  <!-- Wortmarke EMOTION FRAME -->
  <text x="160" y="60" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-size="52" font-weight="900" fill="__TEXT_COLOR__" letter-spacing="-1">EMOTION</text>
  <text x="160" y="118" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-size="52" font-weight="900" fill="__TEXT_COLOR__" letter-spacing="-1">FRAME</text>
</svg>
